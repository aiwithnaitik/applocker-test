name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Ensure Persistent Debug Keystore
        run: |
          if [ ! -f "app/debug.keystore" ]; then
            echo "Generating persistent debug.keystore..."
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "ci: persist debug.keystore for uniform OTA signatures [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Build Debug APK & Release AAB with Gradle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace 2>&1 | tee build.log || {
            echo "### Gradle Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Reset Release Tag (Refreshes published_at for in-app OTA detection)
        uses: actions/github-script@v7
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'latest'
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id
              });
              console.log('Successfully deleted old release latest');
            } catch (e) {
              console.log('No prior release to delete:', e.message);
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/latest'
              });
              console.log('Successfully deleted git tag latest');
            } catch (e) {
              console.log('Tag delete message:', e.message);
            }

      - name: Publish Direct APK & AAB to GitHub Releases (For In-App Auto-Update & Play Store)
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "AppLock Latest (${{ github.run_number }})"
          body: "Automated continuous build for AppLock. Run #${{ github.run_number }} from commit ${{ github.sha }}."
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Failure Log to GitHub Release
        uses: softprops/action-gh-release@v2
        if: failure() && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "AppLock Build Failure (${{ github.run_number }})"
          body: "Build failed on commit ${{ github.sha }}."
          files: build.log
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
